# =============================================================================
# VQ-VAE 固定256帧窗口训练配置文件 - 平衡版
# =============================================================================
# 此配置文件使用固定256帧窗口训练VQ-VAE
# 
# 🔧 关键改进：
# - 使用固定256帧窗口，简化训练和推理流程
# - 平衡的损失权重 - 对不同数据源使用合适的权重
# - 调整beta和mu参数防止codebook崩塌
# 
# 主要策略：
# 1. 固定窗口训练 - 统一使用256帧窗口
# 2. 分组批次 - BEAT和SeG在不同batch中，减少padding
# 3. 平衡的损失权重 - 对不同数据源使用合适的权重
# 4. Beta=1.0 - 增强commitment loss防止codebook崩塌
# =============================================================================

# =============================================================================
# 训练模式配置
# =============================================================================

# 🆕 固定256帧窗口训练模式
use_arbitrary_length: false         # 禁用任意长度训练
max_arbitrary_length: 256           # 固定窗口长度
min_arbitrary_length: 256           # 固定窗口长度

# 🔧 关键改进：按数据集分组的批次
use_grouped_batches: true          # 启用分组批次，确保同一个batch中只包含来自同一数据集的样本

# 变长窗口训练（关闭，使用固定256帧）
use_variable_length: false
min_window_length: 256
max_window_length: 256

# =============================================================================
# 基础训练配置
# =============================================================================

epochs: 400
lr: 1e-4
beta: 0.25          # 🔧 从0.25提高到1.0，增强commitment loss，防止codebook崩塌
warmup_steps: 200
clip_grad_norm: 1.0

# 两阶段训练（关闭，因为256帧窗口对于SeG数据太小）
use_two_stage_training: false
stage1_epochs: 200

# 🔧 调整数据集权重：增加BEAT权重，因为它的样本数更多
seg_weight: 15.0      # 从20.0降到15.0，因为SeG样本本身质量高
beat_weight: 15.0      # 从1.0提高到5.0，增加BEAT重要性
internet_weight: 2.0  # 略微提高

# =============================================================================
# 损失函数配置
# =============================================================================

# 损失函数已简化，只使用基础重建损失
use_amplitude_loss: false
use_velocity_loss: false
use_acceleration_loss: false

# 学习率衰减策略
use_lr_decay: true
lr_decay_start: 600
lr_decay_rate: 0.95
lr_min: 1e-5

# =============================================================================
# 模型架构配置
# =============================================================================

quantizer: ema_reset
code_num: 512
code_dim: 512
output_emb_width: 512

down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
norm: batch_norm
activation: gelu
nfeats: 491
mu: 0.95            # 🔧 EMA动量从0.99调整到0.95，帮助codebook更好地学习

# =============================================================================
# 训练配置
# =============================================================================

use_mixed_stats: true
semantic_weight: 2.5  # 🔧 降低语义权重，平衡BEAT和SeG
ckpt: ""
save_interval: 50
output_dir: "output/vqvae_arbitrary_length_balanced"

monitor_codebook_usage: true
monitor_amplitude: true

# =============================================================================
# 说明
# =============================================================================
# 此配置文件使用固定256帧窗口训练VQ-VAE模型
# 
# 🔧 关键改进点：
# 1. use_grouped_batches: true - 按数据集分组，避免padding浪费
# 2. 不同数据集使用不同窗口大小：
#    - BEAT: 256帧窗口
#    - Internet: 256帧窗口
#    - SeG: 64帧窗口（避免过滤太多数据）
# 3. beta=0.25 - commitment loss权重
# 4. mu=0.95 - 调整EMA动量帮助codebook学习
# 5. 调整数据集权重 - beat_weight设为15.0，seg_weight设为15.0
# 6. 禁用两阶段训练 - 简化训练流程
#
# 预期效果：
# - 不同数据集使用合适的窗口大小，不丢失数据
# - 通过分组批次，BEAT和SeG不会在同一个batch中
# - 训练稳定，所有数据都能被使用
# - 重建质量优秀
#
# 使用方法：
# VQVAE_CONFIG="g1_vqvae_arbitrary_length_balanced.yaml" torchrun --nproc_per_node=8 HRI_mllm/train/train_vqvae_final.py
