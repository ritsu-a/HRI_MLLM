# =============================================================================
# VQ-VAE 任意长度动作序列训练配置文件
# =============================================================================
# 此配置文件支持训练VQ-VAE处理任意长度的动作序列
# 主要特点：
# 1. 保持原始序列长度，不进行窗口截取
# 2. 使用mask机制正确处理padding
# 3. 支持长序列训练（最大512帧）
# =============================================================================

# =============================================================================
# 训练模式配置
# =============================================================================

# 🆕 任意长度训练模式
use_arbitrary_length: true          # 启用任意长度训练
max_arbitrary_length: 512          # 最大允许长度（防止内存溢出）
min_arbitrary_length: 8            # 最小允许长度（确保卷积层正常工作）

# 变长窗口训练（关闭，因为使用任意长度模式）
use_variable_length: false         # 关闭变长窗口训练


# =============================================================================
# 基础训练配置
# =============================================================================

epochs: 1000
lr: 1e-4
beta: 0.25
warmup_steps: 1000
clip_grad_norm: 1.0

# 两阶段训练
use_two_stage_training: true
stage1_epochs: 400

# 数据集权重
seg_weight: 20.0
beat_weight: 1.0
internet_weight: 1.0

# =============================================================================
# 损失函数配置
# =============================================================================

# Amplitude Loss - 保持动作幅度
use_amplitude_loss: true
amplitude_loss_weight: 0.25
amplitude_loss_type: "both"

# QPOS维度定义
qpos_indices:
  body: [246, 247, 248, 249, 250, 251, 252, 253, 254, 255, 256, 257, 258, 259, 260, 261, 262]
  hand: [467, 468, 469, 470, 471, 472, 473, 474, 475, 476, 477, 478, 479, 480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490]

# Velocity Loss - 保持动作动态性
use_velocity_loss: true
velocity_loss_weight: 0.5

# Acceleration Loss - 二阶平滑，防止速度突变
use_acceleration_loss: true
acceleration_loss_weight: 0.2

# 学习率衰减策略
use_lr_decay: true
lr_decay_start: 600
lr_decay_rate: 0.99
lr_min: 1e-5

# =============================================================================
# 模型架构配置
# =============================================================================

down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
norm: batch_norm
activation: gelu
nfeats: 491

# =============================================================================
# 训练配置
# =============================================================================

use_mixed_stats: true
ckpt: ""
save_interval: 50
output_dir: "output/vqvae_arbitrary_length"

monitor_codebook_usage: true
monitor_amplitude: true

# =============================================================================
# 说明
# =============================================================================
# 此配置文件专门用于训练支持任意长度动作序列的VQ-VAE模型
# 
# 主要改进：
# 1. use_arbitrary_length: true - 启用任意长度训练模式
# 2. max_arbitrary_length: 512 - 设置最大允许长度
# 3. 保持原始序列长度，不进行窗口截取
# 4. 使用mask机制正确处理padding
# 5. 支持长序列训练，提高模型对长动作的泛化能力
#
# 使用方法：
# VQVAE_CONFIG="g1_vqvae_arbitrary_length.yaml" torchrun --nproc_per_node=8 HRI_mllm/train/train_vqvae_final.py
