# 激进配置：极致优化SeG数据集的重建
# 适用场景：SeG数据集的重建质量是第一优先级

quantizer: ema_reset
epochs: 5000
lr: 1e-4
beta: 0.25
warmup_steps: 2000
clip_grad_norm: 1.0

# 超大codebook
code_num: 2048
code_dim: 512
output_emb_width: 512

# 编码器配置
down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
norm: batch_norm
activation: gelu
nfeats: 491

# 强语义权重
semantic_weight: 10.0
seg_weight: 20.0
beat_weight: 1.0

# 使用两阶段训练
use_two_stage_training: true
stage1_epochs: 1000  # 前1000轮只训练SeG

# 输出配置
save_interval: 100
output_dir: "output/vqvae_semantic_aggressive"

# 预训练模型（如果有）
ckpt: ""

