# VQ-VAE最终优化配置
# 修复了所有已知问题：
# 1. 平衡BEAT和SeG数据集（semantic_weight=2.5）
# 2. 修复Mixed统计量bug（使用Fixed版本）
# 3. 保持amplitude优化（88-92%）
# 4. 详细的训练日志

quantizer: ema_reset
epochs: 1000
lr: 1e-4
warmup_steps: 2000  # 🔧 增加warmup步数，让模型更平稳地开始
clip_grad_norm: 0.5  # 🔧 降低梯度裁剪阈值，防止quant_loss爆炸

# =============================================================================
# 🔧 关键修复：平衡数据集权重
# =============================================================================

beta: 0.25  # 🔧 降低commitment loss权重，提高训练稳定性（EMA quantizer推荐0.25）

code_num: 512
code_dim: 512
output_emb_width: 512

# 🎯 核心改动1：降低语义权重，避免过度偏向SeG
semantic_weight: 2.5  # 从5.0降到2.5（关键！）
# 之前: SeG样本损失权重 = 5.0x，导致SeG实际权重65%
# 现在: SeG样本损失权重 = 2.5x，更平衡

# 🎯 核心改动2：调整数据集采样权重
beat_weight: 20.0       # 从5.0提高到8.0，增加BEAT重要性
seg_weight: 5.0        # 从3.0提高到4.0，保持SeG优化
internet_weight: 5.0   # 保持不变

# 实际权重分析:
# BEAT实际权重 = 8.0 × 1.0 = 8.0
# SeG实际权重 = 4.0 × 2.5 = 10.0
# Internet实际权重 = 3.0 × 1.0 = 3.0
# 比例: 38% : 48% : 14%
# 对比之前(22% : 65% : 13%)，BEAT权重从22%提升到38%

# 两阶段训练策略（暂不使用）
use_two_stage_training: false
stage1_epochs: 400
stage2_start_epoch: 400

# =============================================================================
# 🎯 Over-Smoothing解决方案（微调）
# =============================================================================

# 🎯 核心改动3：略微降低amplitude loss权重
# 原因: 过高的amplitude loss可能损失重建准确性
use_amplitude_loss: true
amplitude_loss_weight: 0.25      # 从0.3降到0.25
amplitude_loss_type: "both"      # 保持both模式

# QPOS维度定义
qpos_indices:
  body: [246, 247, 248, 249, 250, 251, 252, 253, 254, 255, 256, 257, 258, 259, 260, 261, 262]
  hand: [467, 468, 469, 470, 471, 472, 473, 474, 475, 476, 477, 478, 479, 480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490]

# Velocity Loss保持 + 增强时序平滑性
use_velocity_loss: true
velocity_loss_weight: 0.5  # 🔧 提高5倍，强制时序连续性（从0.1→0.5）

# 🆕 二阶平滑损失（加速度）- 防止速度突变
use_acceleration_loss: true
acceleration_loss_weight: 0.2  # 惩罚加速度变化

# 学习率衰减策略（保持成功的配置）
use_lr_decay: true
lr_decay_start: 600
lr_decay_rate: 0.99
lr_min: 1e-5

# =============================================================================
# 模型架构配置
# =============================================================================

down_t: 2
stride_t: 2
width: 512
depth: 3
dilation_growth_rate: 3
norm: batch_norm
activation: gelu
nfeats: 491

# =============================================================================
# 训练配置
# =============================================================================

use_mixed_stats: true
ckpt: ""
save_interval: 50
output_dir: "output/vqvae_final"

monitor_codebook_usage: true
monitor_amplitude: true

# =============================================================================
# 🔧 变长窗口训练（暂时关闭，mask loss计算有bug）
# =============================================================================

# 是否使用变长窗口训练
# True: 每个batch随机使用不同长度的窗口（32-128帧），提高对长序列的泛化能力
# False: 使用固定32帧窗口（稳定可靠）
use_variable_length: false  # 🔧 回退到固定窗口

# 变长窗口范围（当use_variable_length=true时生效）
min_window_length: 32     # 最小窗口（1.6秒@20fps）
max_window_length: 128    # 最大窗口（6.4秒@20fps）

# 说明：
# - 固定32帧窗口是稳定可靠的方案
# - 变长训练有mask loss bug（loss被放大491倍），暂时不推荐
# - 测试时需要按32帧窗口切分

