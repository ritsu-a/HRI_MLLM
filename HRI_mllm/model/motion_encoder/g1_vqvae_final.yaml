# =============================================================================
# 调优建议
# =============================================================================

# 如果BEAT效果仍不够好:
#   - 进一步增加beat_weight到10.0
#   - 降低semantic_weight到2.0
#   - 降低amplitude_loss_weight到0.2

# 如果SeG效果下降太多:
#   - 增加seg_weight到5.0
#   - 增加semantic_weight到3.0

# 如果想要更高的amplitude ratio:
#   - 增加amplitude_loss_weight到0.3
#   - 但要注意可能再次影响BEAT质量

# =============================================================================
# 关键洞察
# =============================================================================

# 问题根源:
# 1. semantic_weight=5.0 过高，导致SeG样本权重是BEAT的3-5倍
# 2. amplitude loss虽然提升了幅度，但可能损失了姿态准确性
# 3. 需要在"幅度保持"和"重建准确性"之间找到平衡

# 解决策略:
# 1. 降低semantic_weight (5.0→2.5)
# 2. 提高beat_weight (5.0→8.0)
# 3. 微降amplitude_loss_weight (0.3→0.25)
# 4. 让BEAT获得更多优化机会

# 核心权衡:
# - Amplitude Ratio: 91.7% → 88-90% (可接受的代价)
# - BEAT质量: 差 → 良好 (主要收益)
# - 整体平衡性: 显著提升

